<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Website Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link id="site-fonts" rel="stylesheet" href="data:text/css,">
<style>
/* ============ Interface de l'éditeur ============ */
:root{
  --ui-bg:#f3f1ec;--ui-panel:#fbfaf7;--ui-line:#e2ded6;--ui-fg:#1d1f24;--ui-muted:#686c75;
  --ui-accent:#0b7a75;--ui-accent-fg:#fff;--ui-hover:#ebe8e1;--ui-canvas:#dedad2;--ui-danger:#b4390f;
  --ui-input:#fff;--ui-shadow:0 8px 30px rgba(20,20,30,.14);
  --ui-font:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ui-bg:#141518;--ui-panel:#1c1e22;--ui-line:#2c2f36;--ui-fg:#ecebe7;--ui-muted:#9a9ea8;
    --ui-accent:#2dd4bf;--ui-accent-fg:#052420;--ui-hover:#272a30;--ui-canvas:#101114;--ui-danger:#fb923c;
    --ui-input:#14161a;--ui-shadow:0 8px 30px rgba(0,0,0,.5);color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ui-bg);color:var(--ui-fg);font:14px/1.45 var(--ui-font);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}

.ui-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--ui-line);background:var(--ui-panel);border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.ui-btn:hover{background:var(--ui-hover)}
.ui-btn.pri{background:var(--ui-accent);border-color:var(--ui-accent);color:var(--ui-accent-fg)}
.ui-btn.pri:hover{filter:brightness(1.08)}
.ui-btn.sm{padding:5px 10px;font-size:13px}
.ui-btn.danger{color:var(--ui-danger)}
.ui-ic{display:inline-grid;place-items:center;width:34px;height:34px;border:0;background:transparent;border-radius:8px;cursor:pointer;color:var(--ui-fg)}
.ui-ic:hover:not(:disabled){background:var(--ui-hover)}
.ui-ic:disabled{opacity:.35;cursor:default}
.ui-link{border:0;background:none;color:var(--ui-accent);cursor:pointer;padding:0;font-weight:500}
.ui-x{border:0;background:none;color:var(--ui-muted);cursor:pointer;font-size:12px;text-decoration:underline;padding:0}
.logo{display:grid;grid-template-columns:repeat(2,9px);gap:3px}
.logo i{width:9px;height:9px;border-radius:2px;background:var(--ui-accent)}
.logo i:nth-child(2){background:var(--ui-fg);opacity:.85}.logo i:nth-child(3){background:var(--ui-fg);opacity:.35}

/* --- accueil --- */
.home{position:fixed;inset:0;overflow:auto;background:var(--ui-bg);z-index:50}
.home-h{display:flex;align-items:center;gap:12px;padding:20px max(24px,5vw);font-weight:700;font-size:16px}
.home-m{max-width:1120px;margin:0 auto;padding:12px max(24px,4vw) 80px;display:grid;gap:56px}
.home h1{font-size:clamp(30px,5vw,50px);line-height:1.05;margin:0 0 14px;letter-spacing:-.025em;text-wrap:balance;max-width:16ch}
.home .lead{max-width:56ch;color:var(--ui-muted);font-size:17px;margin:0 0 28px}
.home h2{font-size:18px;margin:0 0 16px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.tpl{display:grid;gap:12px;text-align:left;padding:14px;border:1px solid var(--ui-line);background:var(--ui-panel);border-radius:14px;cursor:pointer}
.tpl:hover{border-color:var(--ui-accent);transform:translateY(-2px)}
.tpl{transition:transform .15s,border-color .15s}
.tpl-prev{height:132px;border-radius:9px;padding:12px;display:grid;align-content:start;gap:7px;border:1px solid var(--ui-line)}
.tpl-prev i{display:block;height:8px;border-radius:4px}
.tpl b{font-size:15px}.tpl span{color:var(--ui-muted);font-size:13px}
.plist{display:grid;gap:10px}
.proj{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--ui-line);background:var(--ui-panel);border-radius:12px;flex-wrap:wrap}
.proj-dots{display:flex}.proj-dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ui-panel);margin-left:-5px}.proj-dots i:first-child{margin-left:0}
.proj-i{flex:1;min-width:160px}.proj-i b{display:block}.proj-i small{color:var(--ui-muted)}
.hint-empty{color:var(--ui-muted);padding:18px;border:1px dashed var(--ui-line);border-radius:12px}

/* --- éditeur --- */
.ed{position:fixed;inset:0;display:grid;grid-template-rows:54px 1fr}
.ed-top{display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--ui-panel);border-bottom:1px solid var(--ui-line)}
.ed-top .grow{flex:1}
.pname{border:1px solid transparent;background:transparent;font:600 15px var(--ui-font);color:var(--ui-fg);padding:6px 8px;border-radius:7px;width:min(260px,26vw)}
.pname:hover,.pname:focus{border-color:var(--ui-line);background:var(--ui-input)}
.sep{width:1px;height:22px;background:var(--ui-line);margin:0 4px}
.dev{display:flex;gap:2px;padding:3px;background:var(--ui-hover);border-radius:9px}
.dev button{border:0;background:transparent;width:36px;height:30px;border-radius:7px;cursor:pointer;display:grid;place-items:center}
.dev button.on{background:var(--ui-panel);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.status{color:var(--ui-muted);font-size:12.5px;min-width:96px;text-align:right}
.ed-main{display:grid;grid-template-columns:286px minmax(0,1fr) 330px;min-height:0}
.ed-left,.ed-right{background:var(--ui-panel);overflow:auto;min-height:0}
.ed-left{border-right:1px solid var(--ui-line);display:flex;flex-direction:column}
.ed-right{border-left:1px solid var(--ui-line);padding:16px 16px 60px}
.tabs{display:flex;padding:10px 10px 0;gap:4px;border-bottom:1px solid var(--ui-line);position:sticky;top:0;background:var(--ui-panel);z-index:2}
.tabs button{flex:1;padding:9px;border:0;background:transparent;border-bottom:2px solid transparent;cursor:pointer;font-weight:600;color:var(--ui-muted)}
.tabs button.on{color:var(--ui-fg);border-bottom-color:var(--ui-accent)}
.tabc{padding:14px 12px 40px}
.cat{margin:0 4px 8px;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:20px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:11px;border:1px solid var(--ui-line);background:var(--ui-input);border-radius:10px;cursor:grab;text-align:left;font-weight:500;font-size:13px}
.tile:hover{border-color:var(--ui-accent);background:var(--ui-hover)}
.tile svg{color:var(--ui-accent)}
.ly{display:flex;align-items:center;gap:8px;padding:8px 8px;border:1px solid transparent;border-radius:9px;cursor:pointer;position:relative}
.ly:hover{background:var(--ui-hover)}
.ly.on{background:color-mix(in srgb,var(--ui-accent) 14%,transparent);border-color:var(--ui-accent)}
.ly .grip{color:var(--ui-muted);cursor:grab}
.ly-t{flex:1;min-width:0;display:grid;line-height:1.25}.ly-t b{font-size:13px}.ly-t small{color:var(--ui-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly-a{display:none;gap:0}.ly:hover .ly-a,.ly.on .ly-a{display:flex}
.ly-a .ui-ic{width:26px;height:26px}.ly-a svg{width:15px;height:15px}
.ly.ins-before::before,.ly.ins-after::after{content:"";position:absolute;left:6px;right:6px;height:3px;border-radius:2px;background:var(--ui-accent)}
.ly.ins-before::before{top:-3px}.ly.ins-after::after{bottom:-3px}

.ed-canvas{overflow:auto;background:var(--ui-canvas);padding:22px;min-width:0}
.ed-frame{width:var(--fw,100%);max-width:100%;margin:0 auto;position:relative;transition:width .25s}
.ed-frame .site{box-shadow:0 1px 3px rgba(0,0,0,.14),0 14px 44px rgba(0,0,0,.1);border-radius:6px;min-height:60vh}
.site.is-editor .b:hover{outline:2px solid color-mix(in srgb,var(--ui-accent) 45%,transparent);outline-offset:-2px}
.site.is-editor .b.sel{outline:2px solid var(--ui-accent);outline-offset:-2px}
.site.is-editor:not(.is-preview) [data-edit]{cursor:text}
.site.is-editor:not(.is-preview) .b.sel [data-edit]:hover{outline:1.5px dashed color-mix(in srgb,var(--ui-accent) 70%,transparent);outline-offset:3px;border-radius:2px}
.site.is-editor [data-edit][contenteditable]{outline:2px solid var(--ui-accent)!important;outline-offset:4px;border-radius:2px;min-width:2ch;cursor:text}
.site.is-editor iframe,.site.is-editor video{pointer-events:none}
.site.is-editor.is-preview iframe,.site.is-editor.is-preview video{pointer-events:auto}
.site.is-editor .sp{background:repeating-linear-gradient(135deg,transparent 0 9px,color-mix(in srgb,var(--text) 6%,transparent) 9px 10px)}
.site .empty{display:grid;place-items:center;text-align:center;min-height:56vh;padding:40px;color:var(--muted);font-size:16px}
.site .empty b{display:block;color:var(--text);font-size:20px;margin-bottom:6px}
.tb{position:absolute;right:10px;z-index:30;display:flex;align-items:center;gap:2px;padding:3px;background:var(--ui-accent);color:var(--ui-accent-fg);border-radius:9px;box-shadow:var(--ui-shadow);font:600 12px var(--ui-font)}
.tb span{padding:0 8px 0 6px;white-space:nowrap}
.tb button{border:0;background:transparent;color:inherit;width:28px;height:28px;display:grid;place-items:center;border-radius:6px;cursor:pointer}
.tb button:hover{background:rgba(255,255,255,.22)}
.tb .grip{cursor:grab}
.tb svg{width:16px;height:16px}
.pagesel{width:auto;max-width:180px;padding:6px 8px;font-weight:600}
.pgl{display:grid;gap:6px;margin-bottom:14px}
.pg{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid var(--ui-line);background:var(--ui-input);border-radius:10px;cursor:pointer}
.pg:hover{background:var(--ui-hover)}
.pg.on{border-color:var(--ui-accent);background:color-mix(in srgb,var(--ui-accent) 12%,var(--ui-input))}
.pg-t{flex:1;min-width:0;display:grid;line-height:1.25}.pg-t b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pg-t small{color:var(--ui-muted);font-size:11.5px}
.pg-a{display:flex}.pg-a .ui-ic{width:26px;height:26px}.pg-a svg{width:15px;height:15px}
.ly-col{margin:2px 0;padding:3px 8px;font-size:11.5px;color:var(--ui-muted);border-radius:6px;letter-spacing:.02em}
.ly-col.ins-into{background:color-mix(in srgb,var(--ui-accent) 18%,transparent);outline:2px solid var(--ui-accent)}
.site.is-editor .col-add{display:none;width:100%;margin-top:12px;padding:10px;border:1.5px dashed color-mix(in srgb,var(--text) 32%,transparent);border-radius:8px;background:transparent;color:var(--muted);font:600 13px/1.2 var(--ui-font);cursor:pointer}
.site.is-editor .col-add:hover{border-color:var(--ui-accent);color:var(--ui-accent)}
.site.is-editor .col-add.empty{display:block;min-height:96px;margin-top:0}
.site.is-editor:not(.is-preview) :is(.b-columns2,.b-columns3):is(.sel,:hover,:has(.b.sel)) .col-add{display:block}
.site.is-editor.is-preview .col-add{display:none}
.pick{position:fixed;z-index:160;width:290px;max-height:min(70vh,520px);overflow:auto;padding:12px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;box-shadow:var(--ui-shadow)}
.pick .cat{margin:10px 2px 6px}.pick .cat:first-child{margin-top:0}
.pick-g{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick-g button{display:flex;align-items:center;gap:8px;padding:8px 9px;border:1px solid var(--ui-line);background:var(--ui-input);border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;text-align:left}
.pick-g button:hover{border-color:var(--ui-accent);background:var(--ui-hover)}
.pick-g svg{color:var(--ui-accent);width:16px;height:16px}
.dropline{position:absolute;left:0;right:0;height:4px;background:var(--ui-accent);border-radius:3px;z-index:40;pointer-events:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-accent) 30%,transparent)}

.pn-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.pn-t{display:flex;align-items:center;gap:9px;font-size:16px}.pn-t svg{color:var(--ui-accent)}
.pn-a{display:flex}
.pn-sec{margin:22px 0 10px;padding-top:16px;border-top:1px solid var(--ui-line);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ui-muted)}
.pn-sec:first-child{margin-top:8px;border-top:0;padding-top:0}
.fld{display:grid;gap:6px;margin:0 0 14px;min-width:0}
.fl{font-weight:600;font-size:12.5px}
.fh{margin:0;color:var(--ui-muted);font-size:12px}
.in{width:100%;padding:8px 10px;border:1px solid var(--ui-line);background:var(--ui-input);color:var(--ui-fg);border-radius:8px;font:inherit}
.in:focus{outline:2px solid var(--ui-accent);outline-offset:-1px;border-color:transparent}
textarea.in{resize:vertical;min-height:70px}
.rg{display:flex;align-items:center;gap:10px}.rg input{flex:1;accent-color:var(--ui-accent);min-width:0}.rg output{min-width:46px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ui-muted);font-size:12.5px}
.seg{display:flex;padding:3px;background:var(--ui-hover);border-radius:9px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:7px;cursor:pointer;font-size:12.5px;font-weight:500;white-space:nowrap}
.seg button.on{background:var(--ui-panel);box-shadow:0 1px 3px rgba(0,0,0,.18);font-weight:600}
.clr{display:flex;align-items:center;gap:10px}
.clr input{width:42px;height:34px;padding:0;border:1px solid var(--ui-line);border-radius:8px;background:var(--ui-input);cursor:pointer}
.clr-v{font-size:12.5px;color:var(--ui-muted);font-variant-numeric:tabular-nums;flex:1}
.fld-t{margin-bottom:10px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-weight:500}
.tg input{position:absolute;opacity:0}
.tg i{width:38px;height:22px;border-radius:12px;background:var(--ui-line);position:relative;flex:none;transition:background .15s;order:2}
.tg i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tg input:checked+i{background:var(--ui-accent)}.tg input:checked+i::after{transform:translateX(16px)}
.tg input:focus-visible+i{outline:2px solid var(--ui-accent);outline-offset:2px}
.imgf{display:flex;gap:10px;align-items:center}
.imgf img,.imgf-ph{width:64px;height:64px;border-radius:9px;object-fit:cover;border:1px solid var(--ui-line);background:var(--ui-hover);display:grid;place-items:center;color:var(--ui-muted);flex:none}
.imgf-b{display:flex;gap:6px;flex-wrap:wrap}
.lst{display:grid;gap:10px}
.li{border:1px solid var(--ui-line);border-radius:10px;padding:10px 10px 0;background:color-mix(in srgb,var(--ui-hover) 55%,transparent)}
.li-h{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px;font-weight:600;font-size:12.5px}
.li-h>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.li-a{display:flex}.li-a .ui-ic{width:26px;height:26px}.li-a svg{width:15px;height:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 7px;border:1px solid var(--ui-line);background:var(--ui-input);border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:500}
.chip:hover{border-color:var(--ui-accent)}
.chip i{display:flex}.chip i b{width:14px;height:14px;border-radius:50%;margin-left:-4px;border:1.5px solid var(--ui-input)}.chip i b:first-child{margin-left:0}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ui-fg);color:var(--ui-bg);padding:10px 14px;border-radius:10px;display:flex;gap:14px;align-items:center;z-index:200;box-shadow:var(--ui-shadow);font-weight:500;max-width:90vw}
.toast button{border:0;background:none;color:inherit;text-decoration:underline;cursor:pointer;font-weight:700}
.modal{position:fixed;inset:0;background:rgba(10,10,14,.5);display:grid;place-items:center;z-index:150;padding:20px}
.modal-c{background:var(--ui-panel);border-radius:16px;padding:26px;max-width:560px;width:100%;box-shadow:var(--ui-shadow);max-height:90vh;overflow:auto}
.modal-c h3{margin:0 0 10px;font-size:20px}
.modal-c p{margin:0 0 12px;color:var(--ui-muted)}
.modal-c ol{margin:0 0 18px;padding-left:20px;color:var(--ui-muted)}
.modal-c ol li{margin-bottom:4px}
.modal-b{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.prevbar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:120;display:flex;gap:8px;align-items:center;padding:6px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:12px;box-shadow:var(--ui-shadow)}
.previewing .ed{grid-template-rows:1fr}
.previewing .ed-top{display:none}
.previewing .ed-main{grid-template-columns:minmax(0,1fr)}
.previewing .ed-left,.previewing .ed-right{display:none}
.previewing .ed-canvas{padding-top:70px}
.previewing .tb,.previewing .dropline{display:none}
.previewing .site.is-editor .b:hover,.previewing .site.is-editor .b.sel{outline:0}

@media (max-width:1100px){.ed-main{grid-template-columns:240px minmax(0,1fr) 290px}.pname{width:140px}}
@media (max-width:860px){body{overflow:auto}.ed{position:static;display:block;height:auto}.ed-main{display:block}.ed-left,.ed-right{border:0}.ed-canvas{min-height:70vh;padding:10px}.ed-top{flex-wrap:wrap;padding:8px;height:auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style id="site-css"></style>
</head>
<body>

<!-- ===== Accueil ===== -->
<div id="home" class="home">
  <header class="home-h"><span class="logo"><i></i><i></i><i></i><i></i></span>Website Builder</header>
  <main class="home-m">
    <section>
      <h1>Créez votre site, bloc après bloc.</h1>
      <p class="lead">Choisissez un modèle ou une page vierge, ajoutez des blocs, personnalisez les couleurs et les textes, puis téléchargez votre site prêt à publier. Aucun code à écrire.</p>
      <div class="tpls" id="tpls"></div>
    </section>
    <section>
      <h2>Mes projets</h2>
      <div class="plist" id="plist"></div>
      <p style="margin:16px 0 0"><label class="ui-btn sm">Importer une sauvegarde (.json)<input type="file" accept=".json,application/json" id="import" hidden></label></p>
    </section>
  </main>
</div>

<!-- ===== Éditeur ===== -->
<div id="editor" class="ed" hidden>
  <header class="ed-top">
    <button class="ui-ic" data-do="home" title="Accueil" aria-label="Accueil"></button>
    <input class="pname" id="pname" aria-label="Nom du projet" maxlength="80">
    <span class="sep"></span>
    <button class="ui-ic" data-do="undo" id="b-undo" title="Annuler (Ctrl+Z)" aria-label="Annuler"></button>
    <button class="ui-ic" data-do="redo" id="b-redo" title="Rétablir (Ctrl+Y)" aria-label="Rétablir"></button>
    <span class="sep"></span>
    <select class="in pagesel" id="pagesel" aria-label="Page en cours"></select>
    <span class="grow"></span>
    <div class="dev" role="group" aria-label="Taille d'aperçu">
      <button data-dev="desktop" class="on" title="Ordinateur" aria-label="Ordinateur"></button>
      <button data-dev="tablet" title="Tablette" aria-label="Tablette"></button>
      <button data-dev="mobile" title="Mobile" aria-label="Mobile"></button>
    </div>
    <span class="grow"></span>
    <span class="status" id="status" aria-live="polite"></span>
    <button class="ui-btn" data-do="save"></button>
    <button class="ui-btn" data-do="preview"></button>
    <button class="ui-btn pri" data-do="export"></button>
  </header>
  <div class="ed-main">
    <aside class="ed-left">
      <div class="tabs"><button class="on" data-tab="blocks">Blocs</button><button data-tab="layers">Structure</button><button data-tab="pages">Pages</button></div>
      <div class="tabc" id="tab-blocks"></div>
      <div class="tabc" id="tab-layers" hidden></div>
      <div class="tabc" id="tab-pages" hidden></div>
    </aside>
    <main class="ed-canvas" id="canvas">
      <div class="ed-frame" id="frame">

function safeUrl(u){
  u=String(u||'').trim(); if(!u) return '';
  if(/^(https?:|mailto:|tel:|#|\/|\.\/|\.\.\/)/i.test(u)) return u;

function contrast(hex){
  let h=String(hex||'').replace('#','');

];
const FONT_MAP=Object.fromEntries(FONTS.map(([n,c,w])=>[n,{c,w}]));
function fontStack(n){
  if(!FONT_MAP[n]||n==='Système') return 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif';
  if(n==='Georgia') return 'Georgia,"Times New Roman",serif';
  const c=FONT_MAP[n].c;
  return `"${n}",${c==='serif'?'Georgia,serif':c==='cursive'?'cursive':'system-ui,sans-serif'}`;
}
function fontsHref(d){
  const set=new Set([d.theme.headingFont,d.theme.bodyFont]);
  walkDoc(d,b=>b.props&&b.props.font&&set.add(b.props.font));
  const fam=[...set].filter(n=>FONT_MAP[n]&&FONT_MAP[n].w).map(n=>`family=${n.replace(/ /g,'+')}:wght@${FONT_MAP[n].w}`);
  return fam.length?`https://fonts.googleapis.com/css2?${fam.join('&')}&display=swap`:'';
}

let doc=null,pageId=null;
const curPage=()=>doc&&(doc.pages.find(p=>p.id===pageId)||doc.pages[0]);
const curBlocks=()=>curPage().blocks;
function walk(arr,fn,parent){arr.forEach(b=>{fn(b,parent);if(b.props&&Array.isArray(b.props.cols))b.props.cols.forEach(c=>walk(c.blocks||[],fn,b))})}
function walkDoc(d,fn){d.pages.forEach(pg=>walk(pg.blocks,fn))}
function loc(id,arr,parent,col){
  arr=arr||curBlocks();
  for(let i=0;i<arr.length;i++){
    const b=arr[i];
    if(b.id===id) return {b,arr,idx:i,parent:parent||null,col:col==null?null:col};
    if(b.props&&Array.isArray(b.props.cols)){
      for(let c=0;c<b.props.cols.length;c++){const r=loc(id,b.props.cols[c].blocks||[],b,c);if(r)return r}
    }
  }
  return null;
}
const getArr=(parentId,col)=>{if(!parentId)return curBlocks();const l=loc(parentId);return l?l.b.props.cols[col].blocks:curBlocks()};
const nestable=t=>BLOCKS[t]&&!BLOCKS[t].noNest;
function pageFiles(d){
  const used=new Set(['index']),out={};
  d.pages.forEach((p,i)=>{
    if(i===0){out[p.id]='index.html';return}
    const s=slug(p.name)||'page';let n=s,k=2;
    while(used.has(n)) n=s+'-'+(k++);
    used.add(n);out[p.id]=n+'.html';
  });
  return out;
}
function navList(d,editor){
  const f=pageFiles(d);
  return d.pages.map(p=>({id:p.id,name:p.name,href:editor?'#':f[p.id],file:f[p.id],inMenu:p.inMenu!==false}));
}
function migrateCols(b){
  const p=b.props,al=p.align||'left';
  p.cols=p.cols.map(c=>{
    if(c.blocks) return c;
    const out=[];
    if(c.image) out.push({id:uid(),type:'image',props:{...BLOCKS.image.defaults(),src:c.image,alt:c.title||'',ratio:p.ratio||'4:3',fit:'cover',radius:12}});
    if(c.title) out.push({id:uid(),type:'title',props:{...BLOCKS.title.defaults(),text:c.title,level:'h3',size:'s',align:al}});
    if(c.text) out.push({id:uid(),type:'text',props:{...BLOCKS.text.defaults(),text:c.text,align:al}});
    if(c.btnLabel) out.push({id:uid(),type:'buttons',props:{...BLOCKS.buttons.defaults(),items:[{label:c.btnLabel,url:c.btnUrl||'#',style:'primary',newTab:false}],align:al}});
    return {blocks:out};
  });
  delete p.ratio;delete p.align;
  if(p.valign==null)p.valign='start';
  if(p.split==null)p.split=p.cols.length===2?'1fr 1fr':'1fr 1fr 1fr';
}
function normalizeDoc(d){
  d.theme={...DEFAULT_THEME,...d.theme};
  d.name=d.name||'Mon site';
  if(d.siteTitle==null)d.siteTitle=d.name;
  if(d.siteDesc==null)d.siteDesc='';
  if(!Array.isArray(d.pages)||!d.pages.length){d.pages=[{id:uid(),name:'Accueil',blocks:d.blocks||[]}];}
  delete d.blocks;
  d.pages.forEach(pg=>{
    pg.id=pg.id||uid();pg.name=pg.name||'Page';pg.title=pg.title||'';pg.desc=pg.desc||'';
    if(pg.inMenu==null)pg.inMenu=true;
    pg.blocks=pg.blocks||[];
    walk(pg.blocks,b=>{
      const p=b.props||(b.props={});
      if(b.type==='menu'){if(p.auto==null)p.auto=false;if(p.shared==null)p.shared=true}
      if(b.type==='footer'&&p.shared==null)p.shared=true;
      if((b.type==='columns2'||b.type==='columns3')&&Array.isArray(p.cols)&&p.cols.some(c=>!c.blocks))migrateCols(b);
    });
  });
  return d;
}

function videoEmbed(u){
  u=String(u||'').trim(); let m;
  if((m=u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/embed\/|youtube\.com\/shorts\/)([\w-]{6,})/))) return {k:'iframe',src:`https://www.youtube-nocookie.com/embed/${m[1]}`};
  if((m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))) return {k:'iframe',src:`https://player.vimeo.com/video/${m[1]}`};
  if(/^https?:\/\/\S+\.(mp4|webm|ogg)(\?\S*)?$/i.test(u)) return {k:'video',src:u};
  return null;
}
function embedSrc(code){
  code=String(code||'').trim(); if(!code) return '';
  const m=code.match(/<iframe[^>]+src=["']([^"']+)["']/i);

/* rendu d'un bloc */
function renderBlock(b,ctx,nested){
  const d=BLOCKS[b.type]; if(!d) return '';
  const p=b.props;
  if(nested) return `<section class="b b-in b-${b.type}"${p.anchor?` id="${esc(slug(p.anchor))}"`:''} data-id="${b.id}">${d.render(p,ctx,b)}</section>`;
  const k={none:0,s:.5,m:1,l:1.7,xl:2.4}[p.space==null?'m':p.space];
  let style=`--k:${k==null?1:k};`;
  if(p.bg){style+=`background:${p.bg};--bg:${p.bg};--text:${contrast(p.bg)==='#ffffff'?'#ffffff':'#16181d'};color:var(--text);`}
  if(d.outer) style+=d.outer(p,ctx);
  const cls=['b','b-'+b.type,d.cls?d.cls(p):''].filter(Boolean).join(' ');
  const id=p.anchor?` id="${esc(slug(p.anchor))}"`:'';
  const inner=d.render(p,ctx,b);
  return `<section class="${cls}"${id} data-id="${b.id}" style="${style}">${d.bleed?inner:`<div class="w">${inner}</div>`}</section>`;
}

/* script du site exporté (aussi utilisé dans l'éditeur) */
function siteRuntime(root){
  const live=()=>!(root.classList.contains('is-editor')&&!root.classList.contains('is-preview'));
  root.addEventListener('click',function(e){
    var t=e.target.closest('.nav-toggle');
    if(t){var n=t.closest('.nav');var o=n.classList.toggle('open');t.setAttribute('aria-expanded',String(o));return}
    var l=e.target.closest('.nav-links a');
    if(l){var nn=l.closest('.nav');if(nn){nn.classList.remove('open')}}
    if(!live()) return;
    var g=e.target.closest('a[data-lb]');
    if(g){
      e.preventDefault();
      var o2=document.createElement('div');
      o2.setAttribute('role','dialog');o2.setAttribute('aria-label','Image agrandie');
      o2.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out;padding:24px';
      var im=document.createElement('img');im.src=g.href;im.alt='';
      im.style.cssText='max-width:100%;max-height:100%;border-radius:8px;object-fit:contain';
      o2.appendChild(im);
      var close=function(){o2.remove();document.removeEventListener('keydown',kd)};
      var kd=function(ev){if(ev.key==='Escape')close()};
      o2.addEventListener('click',close);document.addEventListener('keydown',kd);
      document.body.appendChild(o2);
    }
  });
  root.addEventListener('submit',function(e){
    var f=e.target.closest('.frm'); if(!f||!live()) return;
    var mode=f.dataset.mode,ok=f.querySelector('.frm-ok'),er=f.querySelector('.frm-err');
    ok.hidden=true;er.hidden=true;
    if(mode==='mailto'){
      e.preventDefault();
      var lines=[];f.querySelectorAll('[data-l]').forEach(function(x){lines.push(x.dataset.l+' : '+x.value)});
      location.href='mailto:'+(f.dataset.to||'')+'?subject='+encodeURIComponent(f.dataset.title||'Message depuis le site')+'&body='+encodeURIComponent(lines.join('\n\n'));
      ok.hidden=false;return;
    }
    e.preventDefault();
    var btn=f.querySelector('button[type=submit]');btn.disabled=true;
    var net=mode==='netlify';
    fetch(net?'/':f.action,{method:'POST',headers:net?{'Content-Type':'application/x-www-form-urlencoded'}:{'Accept':'application/json'},body:net?new URLSearchParams(new FormData(f)).toString():new FormData(f)})
      .then(function(r){if(!r.ok)throw new Error('x');ok.hidden=false;f.reset()})
      .catch(function(){er.hidden=false})
      .then(function(){btn.disabled=false});
  });
}

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),dt=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name),crc=crc32(f.data),size=f.data.length;
    const lh=new Uint8Array(30+name.length),v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint16(10,dt,true);v.setUint16(12,dd,true);
    v.setUint32(14,crc,true);v.setUint32(18,size,true);v.setUint32(22,size,true);v.setUint16(26,name.length,true);v.setUint16(28,0,true);lh.set(name,30);
    const ch=new Uint8Array(46+name.length),c=new DataView(ch.buffer);
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,size,true);c.setUint32(24,size,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);ch.set(name,46);
    parts.push(lh,f.data);central.push(ch);off+=lh.length+size;
  }
  const cdSize=central.reduce((a,b)=>a+b.length,0),end=new Uint8Array(22),e=new DataView(end.buffer);
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  const all=[...parts,...central,end],out=new Uint8Array(all.reduce((a,b)=>a+b.length,0));let p=0;
  for(const a of all){out.set(a,p);p+=a.length}
  return out;
}
const MIME_EXT={'image/jpeg':'jpg','image/png':'png','image/gif':'gif','image/webp':'webp','image/svg+xml':'svg','image/avif':'avif'};
function dataToBytes(uri){
  const m=uri.match(/^data:([^;,]*)((?:;[^,]*)?),([\s\S]*)$/); if(!m) return null;
  let bytes;
  if(/;base64/.test(m[2])){const bin=atob(m[3]);bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i)}

  return {mime:m[1]||'application/octet-stream',bytes};
}

  const lsObj=()=>{try{return JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){return {}}};
  function open(){
    if(idb) return idb;
    idb=new Promise((res,rej)=>{
      if(typeof indexedDB==='undefined') return rej(new Error('no idb'));
      const r=indexedDB.open('website-builder',1);
      r.onupgradeneeded=()=>r.result.createObjectStore('projects',{keyPath:'id'});
      r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
    }).catch(()=>{useLS=true;return null});
    return idb;
  }
  async function tx(mode,fn){
    const db=await open(); if(!db) return null;
    return new Promise((res,rej)=>{const t=db.transaction('projects',mode);const q=fn(t.objectStore('projects'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});
  }
  return {
    async all(){const r=await tx('readonly',s=>s.getAll());return useLS?lsAll():(r||[])},
    async put(p){const r=await tx('readwrite',s=>s.put(p));if(useLS){const o=lsObj();o[p.id]=p;lsSet(o)}return r},
    async del(id){await tx('readwrite',s=>s.delete(id));if(useLS){const o=lsObj();delete o[id];lsSet(o)}}
  };
})();

/* ---- historique ---- */
const snap=()=>JSON.stringify(doc);
function resetHistory(){hist=[snap()];hi=0;lastKey='';lastT=0;updateUndo()}
function commit(key){
  const s=snap(); if(hist[hi]===s){scheduleSave();return}
  const now=Date.now();
  if(key&&key===lastKey&&now-lastT<900){hist[hi]=s}
  else{hist=hist.slice(0,hi+1);hist.push(s);if(hist.length>150)hist.shift();hi=hist.length-1}
  lastKey=key||'';lastT=now;updateUndo();scheduleSave();
}
function restore(s){doc=JSON.parse(s);if(!doc.pages.some(p=>p.id===pageId))pageId=doc.pages[0].id;if(selId&&!selBlock())selId=null;lastKey='';renderAll();scheduleSave();updateUndo()}
function undo(){if(hi>0){hi--;restore(hist[hi])}}
function redo(){if(hi<hist.length-1){hi++;restore(hist[hi])}}
function updateUndo(){$('#b-undo').disabled=hi<=0;$('#b-redo').disabled=hi>=hist.length-1}

/* ---- enregistrement ---- */
function scheduleSave(){setStatus('Modifications en cours…');clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,700)}
async function saveNow(){
  clearTimeout(saveTimer); if(!doc||!projId) return;
  try{await DB.put({id:projId,name:doc.name,updated:Date.now(),doc:clone(doc)});setStatus('Enregistré ✓')}
  catch(e){setStatus('Échec de l\'enregistrement');toast('Impossible d\'enregistrer : espace de stockage plein. Exportez une sauvegarde depuis le bouton Exporter.')}
}

function addBlock(type,parentId,col,idx){
  if(parentId===undefined){
    const l=selId&&loc(selId);
    if(l&&l.parent&&nestable(type)){parentId=l.parent.id;col=l.col;idx=l.idx+1}
    else if(l&&l.parent){parentId=null;col=null;idx=loc(l.parent.id).idx+1}
    else if(l){parentId=null;col=null;idx=l.idx+1}
    else{parentId=null;col=null;idx=curBlocks().length}
  }
  const arr=getArr(parentId,col);
  if(idx==null) idx=arr.length;
  const b={id:uid(),type,props:BLOCKS[type].defaults()};
  if(type==='menu'||type==='footer'){let ex=null;doc.pages.forEach(pg=>pg.blocks.forEach(x=>{if(!ex&&x.type===type&&x.props.shared)ex=x}));if(ex)b.props=clone(ex.props)}
  arr.splice(Math.min(idx,arr.length),0,b);selId=b.id;
  commit();renderAll();scrollToBlock(b.id,'center');
}
function moveBlock(id,parentId,col,idx){
  const l=loc(id); if(!l) return;
  if(parentId&&(!nestable(l.b.type)||parentId===id)) return;
  const dest=getArr(parentId,col);
  const [b]=l.arr.splice(l.idx,1);
  if(dest===l.arr&&l.idx<idx) idx--;
  dest.splice(Math.max(0,Math.min(idx,dest.length)),0,b);
  commit();renderAll();
}
function shift(id,dir){
  const l=loc(id); if(!l) return;
  const j=l.idx+dir; if(j<0||j>=l.arr.length) return;

}
function dupBlock(id){
  const l=loc(id); if(!l) return;

  l.arr.splice(l.idx+1,0,c);selId=c.id;commit();renderAll();scrollToBlock(c.id);
  toast('Bloc dupliqué');

function delBlock(id){
  const l=loc(id); if(!l) return;

function targetObj(sc){return sc==='t'?doc.theme:sc==='d'?doc:sc==='p'?curPage():(selBlock()||{}).props}

function syncShared(){
  const b=selBlock(); if(!b||!b.props.shared||(b.type!=='menu'&&b.type!=='footer')) return;
  doc.pages.forEach(pg=>{if(pg.id===curPage().id)return;pg.blocks.forEach(x=>{if(x.type===b.type&&x.props.shared)x.props=clone(b.props)})});

function findField(sc,k){
  const fs=sc==='t'?THEME_FIELDS:sc==='d'?DOC_FIELDS:sc==='p'?PAGE_FIELDS:[...(selBlock()?BLOCKS[selBlock().type].fields:[]),...COMMON];
  return fs.find(f=>f.k===k);
}
function readImage(file){
  return new Promise((res,rej)=>{
    if(!/^image\//.test(file.type)) return rej(new Error('Ce fichier n\'est pas une image.'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('Lecture impossible.'));
    fr.onload=()=>{
      const url=fr.result;
      if(/svg|gif/.test(file.type)){if(file.size>2.5e6)return rej(new Error('Image trop lourde (2,5 Mo maximum pour ce format).'));return res(url)}
      const im=new Image();
      im.onerror=()=>rej(new Error('Image illisible.'));
      im.onload=()=>{
        const M=1800,s=Math.min(1,M/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        res(file.type==='image/png'||file.type==='image/webp'?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',.86));
      };
      im.src=url;
    };
    fr.readAsDataURL(file);
  });
}

  const path=t.dataset.edit,raw=String(getPath(b.props,path)||''),multi=t.dataset.multi==='1';

  t.textContent=raw;t.style.whiteSpace='pre-wrap';
  t.contentEditable='plaintext-only';if(t.contentEditable!=='plaintext-only')t.contentEditable='true';

  t.addEventListener('paste',ev=>{ev.preventDefault();document.execCommand('insertText',false,(ev.clipboardData||window.clipboardData).getData('text/plain'))});
  t.addEventListener('keydown',ev=>{
    if(ev.key==='Escape'){ev.preventDefault();cancelled=true;t.blur()}
    else if(ev.key==='Enter'&&(!multi||ev.ctrlKey||ev.metaKey)){ev.preventDefault();t.blur()}

function addPage(){
  let menu=null,foot=null;
  doc.pages.forEach(pg=>pg.blocks.forEach(b=>{if(!menu&&b.type==='menu'&&b.props.shared)menu=b;if(!foot&&b.type==='footer'&&b.props.shared)foot=b}));
  const name='Page '+(doc.pages.length+1);

  doc.pages.push(pg);pageId=pg.id;selId=null;
  commit();renderAll();el.canvas.scrollTop=0;
  const menus=[];walkDoc(doc,b=>{if(b.type==='menu')menus.push(b)});
  if(doc.pages.length===2&&menus.some(m=>!m.props.auto)) toast('Page ajoutée. Lister les pages dans le menu ?','Oui, activer',()=>{walkDoc(doc,b=>{if(b.type==='menu')b.props.auto=true});commit();renderAll()});

  const bs=[...el.site.children].filter(n=>n.classList.contains('b'));
  let idx=bs.length;
  for(let i=0;i<bs.length;i++){const r=bs[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){idx=i;break}}
  const top=bs.length?(idx<bs.length?bs[idx].getBoundingClientRect().top:bs[bs.length-1].getBoundingClientRect().bottom):fr.top;
  return {parent:null,col:null,idx,line:{top:top-fr.top,left:0,width:fr.width}};
}
function performDrop(t){
  const d=dragging;endDrag(); if(!d||!t) return;
  if(d.kind==='new') addBlock(d.type,t.parent,t.col,t.idx); else moveBlock(d.id,t.parent,t.col,t.idx);
}
el.canvas.addEventListener('dragover',e=>{
  if(!dragging) return;e.preventDefault();e.dataTransfer.dropEffect=dragging.kind==='new'?'copy':'move';
  const l=canvasTarget(e).line;el.drop.hidden=false;
  el.drop.style.top=(l.top-2)+'px';el.drop.style.left=l.left+'px';el.drop.style.width=l.width+'px';el.drop.style.right='auto';
});
el.canvas.addEventListener('dragleave',e=>{if(!el.canvas.contains(e.relatedTarget))el.drop.hidden=true});
el.canvas.addEventListener('drop',e=>{if(!dragging)return;e.preventDefault();performDrop(canvasTarget(e))});
function layerTarget(e){
  const cr=e.target.closest('.ly-col');
  if(cr){
    if(!nestable(dragType())) return null;
    return {row:cr,mode:'into',parent:cr.dataset.parent,col:+cr.dataset.col,idx:getArr(cr.dataset.parent,+cr.dataset.col).length};
  }
  const row=e.target.closest('.ly'); if(!row) return null;
  const l=loc(row.dataset.id); if(!l) return null;
  const r=row.getBoundingClientRect(),after=e.clientY>r.top+r.height/2;
  if(l.parent&&!nestable(dragType())){
    const pl=loc(l.parent.id);
    return {row:el.tabL.querySelector(`.ly[data-id="${l.parent.id}"]`)||row,mode:'before',parent:null,col:null,idx:pl.idx+1};
  }
  return {row,mode:after?'after':'before',parent:l.parent?l.parent.id:null,col:l.col,idx:l.idx+(after?1:0)};
}
const clearIns=()=>$$('.ins-before,.ins-after,.ins-into',el.tabL).forEach(n=>n.classList.remove('ins-before','ins-after','ins-into'));
el.tabL.addEventListener('dragover',e=>{
  if(!dragging) return;e.preventDefault();clearIns();
  const t=layerTarget(e);if(t)t.row.classList.add('ins-'+t.mode);
});
el.tabL.addEventListener('drop',e=>{
  if(!dragging) return;e.preventDefault();
  const t=layerTarget(e);performDrop(t||{parent:null,col:null,idx:curBlocks().length});
});

/* sélecteur de bloc dans une colonne */
function closePicker(){const p=$('#pick');if(p)p.remove();document.removeEventListener('mousedown',pickOutside,true)}
function pickOutside(e){if(!e.target.closest('#pick'))closePicker()}
function openPicker(parentId,col,anchor){
  closePicker();
  const d=document.createElement('div');d.id='pick';d.className='pick';
  d.innerHTML=CATEGORIES.map(([cat,types])=>{const ok=types.filter(nestable);return ok.length?`<div class="cat">${cat}</div><div class="pick-g">${ok.map(t=>`<button type="button" data-pt="${t}">${ico(BLOCKS[t].icon)}${BLOCKS[t].label}</button>`).join('')}</div>`:''}).join('');
  document.body.appendChild(d);
  const r=anchor.getBoundingClientRect(),h=d.offsetHeight,w=d.offsetWidth;
  d.style.left=Math.max(8,Math.min(r.left,innerWidth-w-8))+'px';
  d.style.top=(r.bottom+6+h>innerHeight?Math.max(8,r.top-h-6):r.bottom+6)+'px';
  d.addEventListener('click',e=>{const t=e.target.closest('[data-pt]');if(t){closePicker();addBlock(t.dataset.pt,parentId,col)}});
  setTimeout(()=>document.addEventListener('mousedown',pickOutside,true),0);
}

/* raccourcis clavier */
document.addEventListener('keydown',e=>{
  if(el.editor.hidden) return;
  const mod=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable;
  if(mod&&k==='s'){e.preventDefault();saveNow().then(()=>toast('Projet enregistré'));return}
  if(e.key==='Escape'){if($('#pick'))closePicker();else if(!el.modal.hidden)closeModal();else if(previewing)togglePreview();else if(!inField)select(null);return}
  if(inField) return;
  if(mod&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}
  else if(mod&&k==='y'){e.preventDefault();redo()}
  else if(mod&&k==='d'&&selId){e.preventDefault();dupBlock(selId)}
  else if((e.key==='Delete'||e.key==='Backspace')&&selId&&!previewing){e.preventDefault();delBlock(selId)}
});
window.addEventListener('resize',placeToolbar);
window.addEventListener('beforeunload',()=>{if(doc&&projId)saveNow()});

/* =====================================================================
   Export, sauvegarde et fenêtres
   ===================================================================== */
function download(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
const fileName=(d,ext)=>(slug(d.name)||'mon-site')+ext;
function closeModal(){el.modal.hidden=true}
el.modal.addEventListener('click',e=>{if(e.target===el.modal||e.target.closest('[data-close]'))closeModal()});
function openExport(){
  const n=doc.pages.reduce((a,p)=>a+p.blocks.length,0);
  el.modalC.innerHTML=`<h3>Exporter votre site</h3>
  <p>Vous obtenez une archive ZIP avec la page, la mise en forme, les images et un petit script. Le site fonctionne seul, sans cet éditeur, et s'adapte aux ordinateurs, tablettes et mobiles.</p>
  <ol><li>Téléchargez le ZIP et décompressez-le.</li><li>Netlify : glissez le dossier sur app.netlify.com. GitHub Pages ou hébergement classique : envoyez les fichiers tels quels.</li></ol>
  ${n?'':'<p style="color:var(--ui-danger)">Votre page est vide : ajoutez au moins un bloc avant d\'exporter.</p>'}
  <div class="modal-b"><button class="ui-btn pri" id="do-zip"${n?'':' disabled'}>${ico('download')} Télécharger le site (.zip)</button><button class="ui-btn" id="do-json">Sauvegarde du projet (.json)</button><button class="ui-btn" data-close>Fermer</button></div>`;
  el.modal.hidden=false;
  $('#do-zip').onclick=()=>{
    try{
      const files=buildSite(doc);
      download(new Blob([makeZip(files)],{type:'application/zip'}),fileName(doc,'.zip'));
      closeModal();toast('Site exporté : '+files.length+' fichiers dans l\'archive');
    }catch(err){console.error(err);toast('L\'export a échoué : '+err.message)}
  };
  $('#do-json').onclick=()=>{download(new Blob([JSON.stringify({app:'website-builder',version:1,doc},null,1)],{type:'application/json'}),fileName(doc,'.json'));closeModal()};
}

/* =====================================================================
   Accueil et projets
   ===================================================================== */
function fmtDate(t){return new Date(t).toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})+' à '+new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
const countBlocks=d=>{let n=0;(d.pages||[{blocks:d.blocks||[]}]).forEach(pg=>walk(pg.blocks,()=>{n++}));return n};
function renderTemplates(){
  $('#tpls').innerHTML=TEMPLATES.map(t=>`<button class="tpl" data-tpl="${t.id}"><div class="tpl-prev" style="background:${t.colors[0]}"><i style="width:38%;background:${t.colors[2]}"></i><i style="width:64%;background:${t.colors[2]};opacity:.35"></i><i style="width:30%;height:14px;margin-top:6px;background:${t.colors[1]}"></i></div><b>${t.name}</b><span>${t.desc}</span></button>`).join('');
}
async function renderProjects(){
  let list=[];try{list=(await DB.all()).sort((a,b)=>b.updated-a.updated)}catch(e){}
  $('#plist').innerHTML=list.length?list.map(p=>`<div class="proj" data-pid="${p.id}"><span class="proj-dots"><i style="background:${esc(p.doc.theme.bg)}"></i><i style="background:${esc(p.doc.theme.primary)}"></i><i style="background:${esc(p.doc.theme.secondary)}"></i></span><span class="proj-i"><b>${esc(p.name)}</b><small>${countBlocks(p.doc)} bloc${countBlocks(p.doc)>1?'s':''}${p.doc.pages&&p.doc.pages.length>1?' · '+p.doc.pages.length+' pages':''} · modifié le ${fmtDate(p.updated)}</small></span><button class="ui-btn sm pri" data-popen>Ouvrir</button><button class="ui-btn sm danger" data-pdel>Supprimer</button></div>`).join(''):`<p class="hint-empty">Vos projets enregistrés apparaîtront ici. Choisissez un modèle ci-dessus pour commencer.</p>`;
}
$('#tpls').addEventListener('click',e=>{
  const t=e.target.closest('[data-tpl]');if(!t)return;
  openDoc(uid(),TEMPLATES.find(x=>x.id===t.dataset.tpl).make());
});
$('#plist').addEventListener('click',async e=>{
  const row=e.target.closest('[data-pid]');if(!row)return;
  const id=row.dataset.pid;
  if(e.target.closest('[data-popen]')){const p=(await DB.all()).find(x=>x.id===id);if(p)openDoc(id,p.doc)}
  const del=e.target.closest('[data-pdel]');
  if(del){
    if(del.dataset.sure){await DB.del(id);renderProjects()}
    else{del.dataset.sure='1';del.textContent='Confirmer la suppression';setTimeout(()=>{del.dataset.sure='';del.textContent='Supprimer'},3500)}
  }
});
$('#import').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    const j=JSON.parse(t),d=j.doc||j;
    if(!d||!(Array.isArray(d.pages)||Array.isArray(d.blocks))||!d.theme) throw new Error('bad');
    d.name=d.name||'Projet importé';
    openDoc(uid(),d);
  }).catch(()=>toast('Ce fichier n\'est pas une sauvegarde valide.'));
  e.target.value='';
});
function openDoc(id,d){
  doc=normalizeDoc(d);projId=id;selId=null;pageId=doc.pages[0].id;
  el.home.hidden=true;el.editor.hidden=false;
  if(previewing)togglePreview();
  setDevice('desktop');resetHistory();renderAll();saveNow();
  el.canvas.scrollTop=0;
}
async function goHome(){
  await saveNow();
  el.editor.hidden=true;el.home.hidden=false;doc=null;projId=null;
  renderProjects();
}
renderLibrary();renderTemplates();renderProjects();
window.WB={buildSite,makeZip,renderBlock,siteCSS,BLOCKS,TEMPLATES,get doc(){return doc},openDoc,addBlock};
</script>
